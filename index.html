<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Pending Billing</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4f2;--card:#fff;--ink:#111;--mute:#6b6661;--line:#e7e2dd;--brand:#e85d04;--soft:#fde1cc;--hi:#fff2e8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e0e;--card:#1a1a1a;--ink:#f5f5f5;--mute:#a8a29e;--line:#2f2f2f;--brand:#ff8a3d;--soft:#4d2a13;--hi:#271b13}}
:root[data-theme="dark"]{--bg:#0e0e0e;--card:#1a1a1a;--ink:#f5f5f5;--mute:#a8a29e;--line:#2f2f2f;--brand:#ff8a3d;--soft:#4d2a13;--hi:#271b13}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{font:600 22px "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;margin:0}
h2{font:600 15px "IBM Plex Sans Condensed","IBM Plex Sans",sans-serif;margin:0}
.top,.ctl,.hd{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.top{margin-bottom:14px}.hd{margin-bottom:12px}.ctl{justify-content:flex-start;margin-bottom:10px}
.sub{color:var(--mute);font-size:12.5px}
select,input,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 11px}
button{cursor:pointer}button:hover{background:var(--hi)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}.seg button:last-child{border:0}
.seg button.on{background:var(--brand);color:var(--card)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:4px}
.chip{background:var(--soft);border-color:transparent;border-radius:14px;padding:3px 11px;font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.kpis .card{margin:0}.kpis .card:first-child{background:#111;border-color:#111;color:#fff}.kpis .card:first-child b{color:#ff8a3d}.kpis .card:first-child .sub{color:#c9c4bf}.kpi b{display:block;font:600 24px "IBM Plex Sans Condensed",sans-serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}.grid .card{margin:0}
.grid{margin-bottom:12px}
.bar{display:grid;grid-template-columns:140px 1fr 82px;gap:10px;align-items:center;width:100%;border:0;background:none;padding:5px 4px;text-align:left;border-radius:5px}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar.on{background:var(--hi);outline:1px solid var(--brand)}.bar.dim{opacity:.45}
.trk{background:var(--soft);border-radius:3px;height:12px;overflow:hidden}.trk i{display:block;height:100%;background:var(--brand)}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:1120px}input.rs{width:100%;min-width:220px;padding:5px 8px;font-size:13px}input.rs:read-only{background:transparent;border-color:transparent}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500}#th th{cursor:pointer}
.n{text-align:right;font-variant-numeric:tabular-nums}
.cr{cursor:pointer}.cr td:nth-child(1),.cr td:nth-child(2){overflow:hidden;text-overflow:ellipsis}.cr td:nth-child(1){max-width:190px}.cr td:nth-child(2){max-width:130px}.cr:hover,.cr.o{background:var(--hi)}
.sub>td{padding:0 0 0 28px;background:var(--hi)}table.in{min-width:0}table.in td,table.in th{padding:6px 10px}
.ft td{font-weight:600;border:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Pending Billing</h1><div class="sub">Barang sudah terkirim, belum bisa di-invoice · Data per <span id="asof">memuat…</span></div></div><button id="rs">Reset filter</button></div>
<div class="ctl"><div class="seg" id="sA"></div><div class="seg" id="sK"></div><select id="fS" aria-label="Salesperson"></select><input id="q" placeholder="Cari customer / proyek / SO / PO / IF" aria-label="Cari"></div>
<div class="chips" id="chips"></div><div class="kpis" id="kpis"></div>
<div class="grid"><div class="card"><div class="hd"><h2>Per salesperson</h2></div><div id="sales"></div></div>
<div class="card"><div class="hd"><h2>10 customer terbesar</h2></div><div id="cust"></div></div>
<div class="card"><div class="hd"><h2>Material terbesar</h2><div class="seg" id="sV"></div></div><div id="mat"></div></div></div>
<div class="card"><div class="hd"><h2>Summary per customer</h2><span class="sub">Klik baris untuk melihat SO beserta Last Updated on terbaru · Alasan bisa diketik langsung dan tersimpan otomatis <b id="rn"></b></span></div>
<div class="tw"><table><thead><tr id="th"></tr></thead><tbody id="tb"></tbody></table></div></div>
</div><script>
const API='PASTE_URL_APPS_SCRIPT_DI_SINI'; // URL Web App (berakhiran /exec)
const M=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const dt=s=>{const [y,m,d]=s.split('-');return +d+' '+M[m-1]+' '+y};
const fmt=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const short=n=>n>=1e9?(n/1e9).toFixed(2).replace('.',',')+' M':n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' jt':Math.round(n).toLocaleString('id-ID');
let D=[];const mapRows=RAW=>RAW.map(r=>({kat:r[0],area:r[1],cust:r[2],sales:r[3],po:r[4],so:r[5],ref:r[6],cr:r[7],mat:r[8],prod:r[9],dpp:r[10],tot:r[11],lu:r[13],pj:r[14]}));
const $=id=>document.getElementById(id),sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const F={area:'',kat:'',sales:'',mat:'',prod:'',cust:'',q:''};let view='mat',sk='tot',sd=-1;const open=new Set();
const KEYS=['area','kat','sales','mat','prod','cust'];
const filt=(skip=[])=>{const q=F.q.toLowerCase();return D.filter(x=>KEYS.every(k=>skip.includes(k)||!F[k]||x[k]===F[k])&&(!q||(x.cust+x.pj+x.so+x.po+x.ref+(RS[slug(x.cust)]||'')).toLowerCase().includes(q)))};
const group=(a,k)=>{const m={};a.forEach(x=>m[x[k]]=(m[x[k]]||0)+x.tot);return Object.entries(m).sort((p,q)=>q[1]-p[1])};
function bars(id,k,a,n){const g=group(a,k).slice(0,n||99),mx=g[0]?g[0][1]:0;
$(id).innerHTML=g.map(([l,v])=>`<button class="bar${F[k]===l?' on':F[k]?' dim':''}" data-k="${k}" data-v="${encodeURIComponent(l)}" title="${l}"><span>${l}</span><div class="trk"><i style="width:${mx?v/mx*100:0}%"></i></div><em>${short(v)}</em></button>`).join('')||'<div class="sub">Tidak ada data</div>'}
function seg(id,k,opts){$(id).innerHTML=['',...opts].map(o=>`<button class="${F[k]===o?'on':''}" data-seg="1" data-k="${k}" data-v="${encodeURIComponent(o)}">${o||'Semua'}</button>`).join('')}
const rg=(o,x)=>{if(x.lu>o.lu)o.lu=x.lu};
function custs(a){const m={};a.forEach(x=>{const z=()=>({so:{},refs:new Set(),tot:0,lu:x.lu});
const c=m[x.cust]||(m[x.cust]={...z(),cust:x.cust,kat:x.kat,areas:new Set(),pjs:new Set()});
c.areas.add(x.area);c.pjs.add(x.pj);c.refs.add(x.ref);c.tot+=x.tot;rg(c,x);
const s=c.so[x.so]||(c.so[x.so]={...z(),so:x.so,po:x.po,pj:x.pj,mats:new Set()});
s.mats.add(x.mat);s.refs.add(x.ref);s.tot+=x.tot;rg(s,x)});
return Object.values(m).map(c=>({...c,nso:Object.keys(c.so).length,nif:c.refs.size,area:[...c.areas].join('/'),proj:c.pjs.size>1?c.pjs.size+' proyek':[...c.pjs][0],pjl:[...c.pjs].join(' | ')}))}
const RS={};let rdb=null,pend=false;
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'').slice(0,150)||'x';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cols=[['cust','Customer'],['proj','Proyek'],['kat','Kategori'],['area','Area'],['nso','SO','n'],['nif','IF','n'],['lu','Last Updated on'],['tot','Total pending','n']];
function render(){
const a=filt(),C=custs(a),L={area:'Area',kat:'Kategori',sales:'Sales',mat:'Material',prod:'Produk',cust:'Customer'};
seg('sA','area',['WEST','EAST']);seg('sK','kat',['BUMN','SWASTA']);
$('sV').innerHTML=[['mat','Kategori'],['prod','Produk']].map(([v,l])=>`<button class="${view===v?'on':''}" data-view="${v}">${l}</button>`).join('');
$('fS').value=F.sales;
$('chips').innerHTML=KEYS.filter(k=>F[k]).map(k=>`<button class="chip" data-x="${k}">${L[k]}: ${F[k]} ×</button>`).join('');
$('kpis').innerHTML=[['Total pending (incl. PPN)',fmt(sum(a,x=>x.tot))],['DPP',fmt(sum(a,x=>x.dpp))],['Customer',C.length],['Sales order',sum(C,c=>c.nso)],['Item fulfilment (IF)',sum(C,c=>c.nif)]].map(k=>`<div class="card kpi"><span class="sub">${k[0]}</span><b>${k[1]}</b></div>`).join('');
bars('mat',view,filt([view]));bars('cust','cust',filt(['cust']),10);bars('sales','sales',filt(['sales']));
$('th').innerHTML=cols.map(c=>`<th class="${c[2]||''}" data-s="${c[0]}">${c[1]}${sk===c[0]?(sd<0?' ▾':' ▴'):''}</th>`).join('')+'<th>Alasan pending billing</th>';
C.sort((p,q)=>(p[sk]>q[sk]?1:p[sk]<q[sk]?-1:0)*sd);
$('tb').innerHTML=C.map(c=>{const o=open.has(c.cust);return `<tr class="cr${o?' o':''}" data-c="${encodeURIComponent(c.cust)}"><td title="${c.cust}">${o?'▾':'▸'} ${c.cust}</td><td title="${c.pjl}">${c.proj}</td><td>${c.kat}</td><td>${c.area}</td><td class="n">${c.nso}</td><td class="n">${c.nif}</td><td>${dt(c.lu)}</td><td class="n">${fmt(c.tot)}</td><td class="rs"><input class="rs" data-sl="${slug(c.cust)}" data-cu="${esc(c.cust)}" value="${esc(RS[slug(c.cust)]||'')}" placeholder="${rdb?'Ketik alasan…':'-'}" maxlength="300" ${rdb?'':'readonly'}></td></tr>`+(o?`<tr class="sub"><td colspan="9"><table class="in"><thead><tr><th>Sales Order</th><th>PO</th><th>Proyek</th><th>Material</th><th class="n">IF</th><th>Last Updated on</th><th class="n">Total</th></tr></thead><tbody>${Object.values(c.so).sort((p,q)=>q.tot-p.tot).map(s=>`<tr><td>${s.so}</td><td>${s.po}</td><td>${s.pj}</td><td>${[...s.mats].join(', ')}</td><td class="n">${s.refs.size}</td><td>${dt(s.lu)}</td><td class="n">${fmt(s.tot)}</td></tr>`).join('')}</tbody></table></td></tr>`:'')}).join('')
+`<tr class="ft"><td colspan="7">Total ${C.length} customer</td><td class="n">${fmt(sum(C,c=>c.tot))}</td><td></td></tr>`}
document.addEventListener('click',e=>{if(e.target.closest('td.rs'))return;const b=e.target.closest('[data-k],[data-view],[data-s],[data-c],[data-x],#rs');if(!b)return;const d=b.dataset;
if(b.id==='rs'){KEYS.forEach(k=>F[k]='');F.q='';$('q').value=''}
else if(d.view){view=d.view;F.mat=F.prod=''}
else if(d.k){const v=decodeURIComponent(d.v);F[d.k]=d.seg?v:(F[d.k]===v?'':v)}
else if(d.x)F[d.x]='';
else if(d.s){if(sk===d.s)sd*=-1;else{sk=d.s;sd=cols.find(c=>c[0]===d.s)[2]?-1:1}}
else if(d.c){const v=decodeURIComponent(d.c);open.has(v)?open.delete(v):open.add(v)}
render()});
$('fS').onchange=e=>{F.sales=e.target.value;render()};$('q').oninput=e=>{F.q=e.target.value;render()};
const KK='pb_key',gk=()=>{try{return localStorage.getItem(KK)||''}catch(e){return ''}};
async function api(body){for(let n=0;n<2;n++){const key=gk();
const r=await(body?fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,key})}):fetch(API+'?key='+encodeURIComponent(key)+'&t='+Date.now())).then(x=>x.json());
if(r.error==='key'){const v=prompt('Masukkan kode akses dashboard:');if(!v)throw 0;try{localStorage.setItem(KK,v)}catch(e){}continue}
if(r.error)throw 0;return r}throw 0}
async function load(){try{const r=await api();D=mapRows(r.rows);Object.keys(RS).forEach(k=>delete RS[k]);
Object.entries(r.reasons||{}).forEach(([n,v])=>RS[slug(n)]=v);rdb=true;
$('asof').textContent=new Date(r.ts).toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'});
$('fS').innerHTML='<option value="">Semua salesperson</option>'+[...new Set(D.map(x=>x.sales))].sort().map(s=>`<option>${s}</option>`).join('');
render()}catch(e){$('asof').textContent='gagal memuat data (periksa URL Apps Script / kode akses)'}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input.rs'))e.target.blur()});
document.addEventListener('change',async e=>{const i=e.target.closest('input.rs');if(!i||!rdb)return;const k=i.dataset.sl,v=i.value.trim(),old=RS[k]||'';RS[k]=v;$('rn').textContent='· menyimpan…';
try{await api({cust:i.dataset.cu,text:v});$('rn').textContent='· tersimpan'}catch(err){RS[k]=old;$('rn').textContent='· gagal menyimpan';render()}});
render();load();
</script></body></html>
